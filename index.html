<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evaluación: Rompiendo Topes</title>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html2Canvas -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <!-- Confetti para celebración -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animaciones personalizadas */
        .animate-enter { animation: enter 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes enter {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes pop {
            0% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .glass-dark {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="root" class="w-full max-w-lg relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // ⚙️ CONFIGURACIÓN
        // ==========================================
        const NUMERO_DEL_LIDER = ""; 
        // ==========================================

        // --- ICONOS SVG (Estilizados) ---
        const Icons = {
            user: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            play: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none" {...props}><path d="M5 3l14 9-14 9V3z"/></svg>,
            trophy: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M8 21h8m-4-9v9m0-9a5 5 0 0 1-5-5V3h10v4a5 5 0 0 1-5 5z"/><path d="M19 7a3 3 0 0 0 0 6M5 13a3 3 0 0 0 0-6"/></svg>,
            check: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="20 6 9 17 4 12"/></svg>,
            x: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            brain: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            arrow: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>,
            share: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>,
            loader: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin" {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            refresh: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        };

        const questions = [
            {
                questionText: "¿Cuál es la premisa principal de la 'Ley del Tope'?",
                answerOptions: [
                    { answerText: "El ministerio crece sin importar lo que haga el líder.", isCorrect: false },
                    { answerText: "El crecimiento del ministerio se detiene donde el líder se detiene.", isCorrect: true },
                    { answerText: "El ministerio crece solo si hay recursos financieros.", isCorrect: false },
                    { answerText: "Los miembros siempre crecen más rápido que los líderes.", isCorrect: false },
                ],
                explanation: "Tú eres el techo de tu organización. Si tú dejas de crecer, bloqueas el crecimiento de todo el ministerio."
            },
            {
                questionText: "En la metáfora del edificio, si tú eres el ascensor y llegas al piso 8, ¿qué pasa con tu gente?",
                answerOptions: [
                    { answerText: "Suben por las escaleras al piso 20.", isCorrect: false },
                    { answerText: "Se quedan en la planta baja.", isCorrect: false },
                    { answerText: "Llegan solo hasta el piso 8 contigo.", isCorrect: true },
                    { answerText: "Buscan otro ascensor inmediatamente.", isCorrect: false },
                ],
                explanation: "Nadie puede ir más allá de donde su líder lo lleva. Tu nivel de madurez es el límite de ellos."
            },
            {
                questionText: "¿Qué consecuencia trae una gran unción sobre un carácter inmaduro?",
                answerOptions: [
                    { answerText: "Produce podredumbre y destrucción.", isCorrect: true },
                    { answerText: "Acelera la madurez del líder.", isCorrect: false },
                    { answerText: "Santifica automáticamente al líder.", isCorrect: false },
                    { answerText: "No tiene ninguna consecuencia negativa.", isCorrect: false },
                ],
                explanation: "El don sin carácter corrompe. Necesitas estructura interna para soportar el peso de la bendición."
            },
            {
                questionText: "¿Qué significa hacer la obra 'indolentemente' según Jeremías 48:10?",
                answerOptions: [
                    { answerText: "Hacerla muy rápido.", isCorrect: false },
                    { answerText: "Hacerla con negligencia, apatía o por cumplir.", isCorrect: true },
                    { answerText: "Hacerla sin dinero.", isCorrect: false },
                    { answerText: "Hacerla con mucho dolor.", isCorrect: false },
                ],
                explanation: "La indolencia es una actitud de tibieza y descuido que Dios condena severamente en el liderazgo."
            },
            {
                questionText: "Si los miembros son 'Computadoras Cuánticas', ¿tú qué eres en la analogía?",
                answerOptions: [
                    { answerText: "El antivirus.", isCorrect: false },
                    { answerText: "La electricidad.", isCorrect: false },
                    { answerText: "La Red de Internet (conexión).", isCorrect: true },
                    { answerText: "El teclado.", isCorrect: false },
                ],
                explanation: "Tú eres la conexión. Si tu red es lenta (tu liderazgo), limitas la velocidad de ellos, aunque sean potentes."
            },
            {
                questionText: "Según Proverbios 16:18, ¿dónde se origina realmente el tope?",
                answerOptions: [
                    { answerText: "En lo externo (circunstancias).", isCorrect: false },
                    { answerText: "En lo interno (soberbia, carácter).", isCorrect: true },
                    { answerText: "En la falta de apoyo.", isCorrect: false },
                    { answerText: "En el enemigo.", isCorrect: false },
                ],
                explanation: "Antes de la caída hay altivez. El problema raíz siempre está adentro: falta de gestión emocional o formación."
            },
            {
                questionText: "Según el consejo de Jetro a Moisés (Éxodo 18), ¿qué pasa si el líder no delega?",
                answerOptions: [
                    { answerText: "El líder se vuelve más fuerte.", isCorrect: false },
                    { answerText: "Desfallece el líder y también el pueblo.", isCorrect: true },
                    { answerText: "El pueblo aprende a esperar.", isCorrect: false },
                    { answerText: "Dios se agrada del esfuerzo.", isCorrect: false },
                ],
                explanation: "Un líder que lo hace todo se cansa y cansa a su gente. Delegar es vital para no ser el tope."
            },
            {
                questionText: "¿Por qué es necesaria la humildad (Prov 11:2) para quitar un tope?",
                answerOptions: [
                    { answerText: "Para caerle bien a la gente.", isCorrect: false },
                    { answerText: "Para reconocer que necesito corrección y organización.", isCorrect: true },
                    { answerText: "Para parecer más espiritual.", isCorrect: false },
                    { answerText: "La humildad no es necesaria.", isCorrect: false },
                ],
                explanation: "Sin humildad no puedes admitir que tienes un problema, y si no lo admites, no puedes cambiarlo."
            },
            {
                questionText: "¿Qué implica la 'Formación Intencional' (2 Timoteo 2:15)?",
                answerOptions: [
                    { answerText: "Esperar a que la iglesia me capacite.", isCorrect: false },
                    { answerText: "Aprender solo por experiencia.", isCorrect: false },
                    { answerText: "Procurar activamente estudiar y prepararse.", isCorrect: true },
                    { answerText: "Orar para recibir conocimiento sobrenatural.", isCorrect: false },
                ],
                explanation: "No es pasivo. Tú debes tener la intención de leer, estudiar y buscar crecimiento."
            },
            {
                questionText: "¿Cuál es el objetivo final de romper nuestros topes?",
                answerOptions: [
                    { answerText: "Ser famosos.", isCorrect: false },
                    { answerText: "Tener el ministerio más grande.", isCorrect: false },
                    { answerText: "Multiplicarnos y que otros crezcan.", isCorrect: true },
                    { answerText: "Trabajar menos.", isCorrect: false },
                ],
                explanation: "El éxito del líder es la multiplicación: que otros brillen y crezcan gracias a que tú les abriste camino."
            }
        ];

        function App() {
            const [gameState, setGameState] = useState('start');
            const [userName, setUserName] = useState('');
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showFeedback, setShowFeedback] = useState(false);
            const [isCorrect, setIsCorrect] = useState(false);
            const [selectedAnswerIndex, setSelectedAnswerIndex] = useState(null);
            const [isSent, setIsSent] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const resultCardRef = useRef(null);

            // Efecto de Confeti al ganar
            useEffect(() => {
                if (gameState === 'result') {
                    const duration = 3 * 1000;
                    const animationEnd = Date.now() + duration;
                    const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                    const randomInRange = (min, max) => Math.random() * (max - min) + min;

                    const interval = setInterval(function() {
                        const timeLeft = animationEnd - Date.now();

                        if (timeLeft <= 0) {
                            return clearInterval(interval);
                        }

                        const particleCount = 50 * (timeLeft / duration);
                        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                    }, 250);
                }
            }, [gameState]);

            const handleStart = (e) => {
                e.preventDefault();
                if (userName.trim()) setGameState('quiz');
            };

            const handleAnswer = (isCorrect, index) => {
                if (showFeedback) return; // Prevenir múltiples clics
                setIsCorrect(isCorrect);
                setSelectedAnswerIndex(index);
                setShowFeedback(true);
                if (isCorrect) setScore(score + 1);
            };

            const handleNext = () => {
                const nextQuestion = currentQuestion + 1;
                if (nextQuestion < questions.length) {
                    setCurrentQuestion(nextQuestion);
                    setShowFeedback(false);
                    setSelectedAnswerIndex(null);
                } else {
                    setGameState('result');
                }
            };

            const handleRestart = () => {
                setScore(0);
                setCurrentQuestion(0);
                setGameState('start');
                setUserName('');
                setShowFeedback(false);
                setSelectedAnswerIndex(null);
                setIsSent(false);
            };

            const handleShareWhatsApp = async () => {
                setIsGenerating(true);
                const simpleHash = btoa(userName + score + "SECRET").slice(0, 8).toUpperCase();
                const messageText = `*EVALUACIÓN: ROMPIENDO TOPES*\n\n👤 Líder: ${userName}\n📊 Puntuación: ${score}/${questions.length}\n🔐 Ref: ${simpleHash}`;

                // Pequeña espera para asegurar renderizado
                await new Promise(resolve => setTimeout(resolve, 500));

                if (resultCardRef.current && navigator.share) {
                    try {
                        const canvas = await html2canvas(resultCardRef.current, {
                            scale: 2,
                            backgroundColor: null, // Transparente si es posible
                            useCORS: true
                        });
                        
                        canvas.toBlob(async (blob) => {
                            if (blob) {
                                const file = new File([blob], "mi_certificado.png", { type: "image/png" });
                                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                    try {
                                        await navigator.share({
                                            files: [file],
                                            text: messageText,
                                        });
                                        setIsSent(true);
                                    } catch (err) {
                                        openWhatsAppTextFallback(messageText);
                                    }
                                } else {
                                    openWhatsAppTextFallback(messageText);
                                }
                            }
                        });
                    } catch (error) {
                        console.error(error);
                        openWhatsAppTextFallback(messageText);
                    }
                } else {
                    openWhatsAppTextFallback(messageText);
                }
                setIsGenerating(false);
            };

            const openWhatsAppTextFallback = (text) => {
                const url = `https://wa.me/${NUMERO_DEL_LIDER}?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
                setIsSent(true);
            };

            // --- VISTAS ---

            if (gameState === 'start') {
                return (
                    <div className="glass rounded-3xl p-8 animate-enter shadow-2xl">
                        <div className="text-center mb-10">
                            <div className="bg-gradient-to-tr from-indigo-500 to-purple-500 w-24 h-24 rounded-2xl rotate-3 flex items-center justify-center mx-auto mb-6 shadow-lg transform transition hover:rotate-6">
                                <Icons.user className="w-12 h-12 text-white" />
                            </div>
                            <h1 className="text-3xl font-extrabold text-gray-800 mb-2 tracking-tight">Evaluación de Liderazgo</h1>
                            <p className="text-indigo-600 font-semibold bg-indigo-50 inline-block px-4 py-1 rounded-full text-sm">Rompiendo Topes</p>
                        </div>
                        
                        <form onSubmit={handleStart} className="space-y-6">
                            <div className="relative group">
                                <label className="block text-sm font-semibold text-gray-500 mb-2 ml-1">¿Cuál es tu nombre?</label>
                                <input 
                                    type="text" 
                                    value={userName}
                                    onChange={(e) => setUserName(e.target.value)}
                                    placeholder="Escribe tu nombre aquí..."
                                    className="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl text-gray-800 focus:border-indigo-500 focus:ring-0 focus:outline-none focus:bg-white transition-all text-lg"
                                    required
                                />
                            </div>
                            <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 px-6 rounded-2xl shadow-xl shadow-indigo-200 transform transition hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3 text-lg">
                                <span>Comenzar Ahora</span> <Icons.play className="w-5 h-5" />
                            </button>
                        </form>
                    </div>
                );
            }

            if (gameState === 'result') {
                return (
                    <div className="animate-enter w-full">
                        {/* TARJETA CAPTURABLE */}
                        <div ref={resultCardRef} className="bg-white rounded-3xl shadow-2xl overflow-hidden relative border-8 border-white">
                            {/* Fondo decorativo interno */}
                            <div className="absolute top-0 left-0 w-full h-32 bg-gradient-to-r from-indigo-600 to-purple-600"></div>
                            <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                            
                            <div className="relative pt-12 pb-8 px-6 text-center z-10">
                                <div className="mx-auto bg-white p-2 rounded-full w-28 h-28 shadow-xl mb-4 flex items-center justify-center relative">
                                     <div className="absolute inset-0 rounded-full border-4 border-yellow-400 border-dashed animate-spin-slow" style={{animationDuration: '10s'}}></div>
                                    <Icons.trophy className="w-14 h-14 text-yellow-500" />
                                </div>
                                
                                <h2 className="text-indigo-900 font-bold tracking-widest text-xs uppercase mb-2">Certificado de Excelencia</h2>
                                <h1 className="text-3xl font-black text-gray-800 mb-1 capitalize leading-tight">{userName}</h1>
                                <p className="text-gray-400 text-sm mb-6 font-medium">Ha completado el módulo "Rompiendo Topes"</p>
                                
                                <div className="flex justify-center items-center gap-4 mb-8">
                                    <div className="text-center px-6 py-3 bg-gray-50 rounded-2xl border border-gray-100">
                                        <div className="text-xs text-gray-400 font-bold uppercase">Nota</div>
                                        <div className="text-4xl font-black text-indigo-600">{score}</div>
                                    </div>
                                    <div className="text-center px-6 py-3 bg-gray-50 rounded-2xl border border-gray-100">
                                        <div className="text-xs text-gray-400 font-bold uppercase">Total</div>
                                        <div className="text-4xl font-black text-gray-300">/{questions.length}</div>
                                    </div>
                                </div>

                                <div className={`p-4 rounded-xl text-sm font-semibold ${score >= 7 ? 'bg-green-50 text-green-700' : 'bg-orange-50 text-orange-700'}`}>
                                    {score === questions.length ? "🏆 ¡Liderazgo Impecable!" : score >= 7 ? "🌟 ¡Gran trabajo, líder!" : "📚 ¡Sigue preparándote!"}
                                </div>
                            </div>
                             {/* Footer visual de la tarjeta */}
                            <div className="bg-gray-50 p-3 flex justify-between items-center text-[10px] text-gray-400 uppercase tracking-wider font-semibold border-t">
                                <span>{new Date().toLocaleDateString()}</span>
                                <span>Verificado</span>
                            </div>
                        </div>

                        {/* ACCIONES */}
                        <div className="mt-6 space-y-3">
                            {!isSent ? (
                                <button 
                                    onClick={handleShareWhatsApp}
                                    disabled={isGenerating}
                                    className="w-full bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold py-4 rounded-2xl shadow-lg shadow-green-200 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2 disabled:opacity-70 disabled:transform-none"
                                >
                                    {isGenerating ? <><Icons.loader className="w-5 h-5" /> Generando...</> : <><Icons.share className="w-5 h-5" /> Compartir Resultado</>}
                                </button>
                            ) : (
                                <div className="w-full bg-green-100 text-green-700 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 animate-pop border border-green-200">
                                    <Icons.check className="w-5 h-5" /> ¡Enviado!
                                </div>
                            )}
                            
                            <button onClick={handleRestart} className="w-full bg-white text-gray-600 font-bold py-4 rounded-2xl hover:bg-gray-50 border border-gray-200 transition flex items-center justify-center gap-2">
                                <Icons.refresh className="w-5 h-5" /> Volver a intentar
                            </button>
                        </div>
                    </div>
                );
            }

            // --- QUIZ VIEW ---
            return (
                <div className="glass-dark rounded-3xl overflow-hidden animate-enter shadow-2xl flex flex-col max-h-[90vh]">
                    {/* Header */}
                    <div className="bg-white/50 backdrop-blur-sm p-6 border-b border-gray-100 flex justify-between items-center z-20">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold text-lg">
                                {userName.charAt(0).toUpperCase()}
                            </div>
                            <div className="flex flex-col">
                                <span className="text-xs font-bold text-gray-400 uppercase tracking-wide">Progreso</span>
                                <span className="text-sm font-bold text-gray-800">{currentQuestion + 1} <span className="text-gray-400 font-normal">/ {questions.length}</span></span>
                            </div>
                        </div>
                    </div>

                    {/* Progress Bar */}
                    <div className="w-full bg-gray-100 h-1.5">
                        <div className="bg-gradient-to-r from-indigo-500 to-purple-500 h-1.5 transition-all duration-700 ease-out rounded-r-full" style={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }}></div>
                    </div>
                    
                    {/* Content Scrollable */}
                    <div className="p-6 overflow-y-auto custom-scrollbar flex-1">
                        <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-8 leading-snug">
                            {questions[currentQuestion].questionText}
                        </h2>
                        
                        <div className="space-y-3 pb-4">
                            {!showFeedback ? (
                                questions[currentQuestion].answerOptions.map((option, index) => (
                                    <button 
                                        key={index} 
                                        onClick={() => handleAnswer(option.isCorrect, index)} 
                                        className="w-full text-left p-5 rounded-2xl bg-white border border-gray-100 shadow-sm hover:shadow-md hover:border-indigo-300 hover:bg-indigo-50/50 transition-all duration-200 group relative overflow-hidden"
                                    >
                                        <div className="relative z-10 flex items-center justify-between">
                                            <span className="font-medium text-gray-600 group-hover:text-indigo-800 transition-colors">{option.answerText}</span>
                                            <div className="w-5 h-5 rounded-full border-2 border-gray-200 group-hover:border-indigo-400"></div>
                                        </div>
                                    </button>
                                ))
                            ) : (
                                <div className="animate-enter">
                                    {/* Mostrar opciones pero marcadas */}
                                    <div className="space-y-2 mb-6 opacity-60 pointer-events-none grayscale-[0.5]">
                                         {questions[currentQuestion].answerOptions.map((option, idx) => (
                                            <div key={idx} className={`p-4 rounded-xl border ${idx === selectedAnswerIndex ? (option.isCorrect ? 'bg-green-100 border-green-500' : 'bg-red-100 border-red-500') : 'bg-gray-50 border-transparent'}`}>
                                                {option.answerText}
                                            </div>
                                         ))}
                                    </div>

                                    {/* Tarjeta de Feedback */}
                                    <div className={`rounded-2xl p-6 shadow-lg border-l-4 ${isCorrect ? 'bg-white border-green-500 shadow-green-100' : 'bg-white border-red-500 shadow-red-100'} animate-pop`}>
                                        <div className="flex items-center gap-3 mb-3">
                                            {isCorrect ? <div className="bg-green-100 p-2 rounded-full text-green-600"><Icons.check className="w-6 h-6"/></div> : <div className="bg-red-100 p-2 rounded-full text-red-600"><Icons.x className="w-6 h-6"/></div>}
                                            <h3 className={`font-bold text-lg ${isCorrect ? 'text-green-700' : 'text-red-700'}`}>{isCorrect ? "¡Excelente!" : "Respuesta Incorrecta"}</h3>
                                        </div>
                                        
                                        <div className="bg-gray-50 rounded-xl p-4 mt-2">
                                            <div className="flex gap-3">
                                                <Icons.brain className="w-5 h-5 text-indigo-500 shrink-0 mt-1" />
                                                <p className="text-gray-600 text-sm leading-relaxed">{questions[currentQuestion].explanation}</p>
                                            </div>
                                        </div>

                                        <button onClick={handleNext} className="w-full mt-6 bg-gray-900 text-white font-bold py-4 rounded-xl hover:bg-gray-800 transition shadow-lg flex items-center justify-center gap-2">
                                            {currentQuestion === questions.length - 1 ? "Ver Resultados" : "Siguiente"} <Icons.arrow className="w-4 h-4" />
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
