<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Liderazgo: La Esencia de la Influencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px -10px rgba(79, 70, 229, 0.15);
        }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #6366f1;
        }

        .option-btn.correct {
            background-color: #ecfdf5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
        }

        .option-btn.incorrect {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .feedback-modal-backdrop {
            background: rgba(17, 24, 39, 0.5);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }
        
        .progress-bar-fill { transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen text-gray-800">

    <div class="glass-panel w-full max-w-lg overflow-hidden relative flex flex-col min-h-[600px] border border-white/50">
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-indigo-700 p-6 text-white text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
            <h1 class="text-2xl font-bold relative z-10">Liderazgo & Influencia</h1>
            <p class="text-indigo-100 text-xs mt-1 font-medium tracking-wide uppercase relative z-10">Basado en John C. Maxwell</p>
        </div>

        <!-- Content Area -->
        <div class="p-6 md:p-8 flex-grow flex flex-col relative z-0" id="app-content"></div>

        <!-- Branding Footer -->
        <div class="bg-gray-50/80 p-3 text-center border-t border-gray-100">
            <p class="text-[10px] text-gray-400 font-semibold tracking-wider uppercase">Desarrollo Personal • 2024</p>
        </div>
    </div>

    <!-- FEEDBACK MODAL -->
    <div id="feedback-overlay" class="fixed inset-0 z-50 flex items-center justify-center feedback-modal-backdrop hidden opacity-0 px-4">
        <div id="feedback-card" class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 transform scale-90 opacity-0 transition-all duration-300 border-4 border-white relative overflow-hidden text-center">
            <div id="feedback-icon-container" class="w-16 h-16 mx-auto rounded-full flex items-center justify-center text-3xl mb-4 shadow-lg"></div>
            <h2 id="feedback-title" class="text-2xl font-bold mb-2"></h2>
            <div class="bg-gray-50 rounded-xl p-4 mb-6 text-left border border-gray-100">
                <p class="text-[10px] text-gray-400 font-bold uppercase mb-1">Lección:</p>
                <p id="feedback-text" class="text-gray-600 text-sm leading-relaxed font-medium"></p>
            </div>
            <button onclick="nextQuestion()" class="w-full py-3.5 rounded-xl font-bold text-white bg-indigo-600 shadow-lg flex items-center justify-center gap-2">
                <span>Continuar</span> <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 z-[60] flex flex-col items-center justify-center bg-black/80 hidden text-white text-center p-4">
        <i class="fas fa-circle-notch fa-spin text-4xl mb-4 text-indigo-400"></i>
        <h3 class="text-xl font-bold mb-2">Procesando...</h3>
        <p class="text-sm text-gray-300" id="loading-text">Generando imagen de tu resultado.</p>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const FALLBACK_PHONE = ""; // Número destino opcional (formato internacional)

        const quizData = [
            {
                question: "¿Cuál es la verdadera medida del liderazgo?",
                options: ["Gestión y administración", "Título o posición jerárquica", "Influencia, nada más", "Antigüedad en la empresa"],
                correct: 2,
                feedback: "El texto es tajante: si no tienes influencia, no puedes dirigir a otros, sin importar tu cargo."
            },
            {
                question: "Completa el proverbio: 'El que se cree líder y no tiene seguidores...'",
                options: ["...pierde el tiempo", "...sólo da un paseo", "...necesita más poder", "...es un soñador"],
                correct: 1,
                feedback: "Liderar implica gente siguiéndote. Si nadie te sigue, estás caminando solo, 'dando un paseo'."
            },
            {
                question: "¿Qué afirma el 'Mito de la Posición'?",
                options: ["El cargo hace al líder", "El líder rechaza cargos", "La posición es vital", "El cargo es eterno"],
                correct: 0,
                feedback: "Es el error más común. La realidad es al revés: es el líder quien hace a la posición importante."
            },
            {
                question: "Diferencia clave entre Gerente y Líder (Mito de la Administración):",
                options: ["El salario", "El gerente mantiene, el líder cambia", "El líder organiza, el gerente inspira", "Son sinónimos"],
                correct: 1,
                feedback: "Un gerente mantiene el rumbo y los sistemas. Se requiere influencia (liderazgo) para cambiar el rumbo."
            },
            {
                question: "¿Qué aprendemos de Abraham Lincoln como 'Capitán'?",
                options: ["Fue un éxito inmediato", "El título no le dio respeto", "La guerra era fácil", "Era muy estricto"],
                correct: 1,
                feedback: "A pesar de tener el título oficial, carecía de influencia y sus hombres no lo seguían."
            },
            {
                question: "¿Por qué el pueblo no siguió a Josué inicialmente?",
                options: ["Josué mentía", "Falta de influencia", "Miedo a Dios", "Era muy joven"],
                correct: 1,
                feedback: "Tenía la razón y la verdad, pero le faltaba la 'cuenta bancaria' de influencia con el pueblo."
            },
            {
                question: "¿Qué es el 'Mito del Conocimiento'?",
                options: ["Alto IQ = Líder", "Saber es poder", "Leer mucho ayuda", "Liderar es estudiar"],
                correct: 0,
                feedback: "Tener un coeficiente intelectual alto no garantiza seguidores. Hay muchos genios solitarios."
            },
            {
                question: "La 'Influencia por Esencia' bíblica se compara con:",
                options: ["Martillo y Clavo", "Sal y Luz", "Rey y Trono", "Espada y Escudo"],
                correct: 1,
                feedback: "Como la sal da sabor y la luz ilumina, la mera presencia y carácter del líder cambian el ambiente."
            },
            {
                question: "¿Cómo lideraba Pablo según 1 Corintios 11:1?",
                options: ["Imponiendo reglas", "Por decreto", "Invitando a imitarle", "Pagando salarios"],
                correct: 2,
                feedback: "Su liderazgo era por ejemplo: 'Sed imitadores de mí'. No exigía sumisión, inspiraba."
            },
            {
                question: "El liderazgo es un ______ que se debe ejercitar.",
                options: ["Don mágico", "Músculo", "Privilegio", "Misterio"],
                correct: 1,
                feedback: "No es algo estático. Como un músculo, si no se trabaja conectando con la gente, se atrofia."
            }
        ];

        let state = { userName: '', idx: 0, score: 0 };
        const content = document.getElementById('app-content');
        const overlay = document.getElementById('feedback-overlay');
        const loadingOverlay = document.getElementById('loading-overlay');

        function renderStart() {
            content.innerHTML = `
                <div class="flex flex-col h-full justify-center items-center text-center space-y-8 fade-in">
                    <div class="w-24 h-24 bg-white border-4 border-indigo-100 rounded-full flex items-center justify-center text-indigo-600 text-3xl shadow-xl">
                        <i class="fas fa-rocket"></i>
                    </div>
                    <div class="space-y-2">
                        <h2 class="text-3xl font-bold text-gray-800">Bienvenido</h2>
                        <p class="text-gray-500">¿Tienes la influencia necesaria?</p>
                    </div>
                    <div class="w-full max-w-xs space-y-4">
                        <input type="text" id="username" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-100 rounded-xl outline-none focus:border-indigo-500 font-semibold text-gray-700" placeholder="Escribe tu nombre">
                        <button onclick="startGame()" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
                            Comenzar <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>`;
        }

        function startGame() {
            const input = document.getElementById('username');
            if(!input.value.trim()) return input.focus();
            state.userName = input.value;
            renderQuiz();
        }

        function renderQuiz() {
            const q = quizData[state.idx];
            const pct = (state.idx / quizData.length) * 100;
            content.innerHTML = `
                <div class="w-full h-full flex flex-col fade-in">
                    <div class="flex justify-between items-end mb-2">
                        <span class="text-xs font-bold text-indigo-500 uppercase">Pregunta ${state.idx + 1}/${quizData.length}</span>
                        <div class="flex items-center gap-1 bg-indigo-50 px-2 py-1 rounded-lg">
                            <i class="fas fa-star text-yellow-400 text-[10px]"></i>
                            <span class="text-xs font-bold text-indigo-900">${state.score}</span>
                        </div>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-2 mb-6 overflow-hidden">
                        <div class="bg-indigo-500 h-full rounded-full progress-bar-fill" style="width: ${pct}%"></div>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-6 leading-snug">${q.question}</h3>
                    <div class="flex-grow space-y-3">
                        ${q.options.map((opt, i) => `
                            <button onclick="checkAnswer(${i}, this)" class="option-btn w-full text-left p-4 rounded-xl border-2 border-transparent bg-white shadow-sm text-gray-600 font-semibold text-sm flex items-center group">
                                <span class="w-8 h-8 rounded-lg bg-gray-50 text-gray-400 font-bold flex items-center justify-center mr-4 group-hover:bg-indigo-50 group-hover:text-indigo-600 border border-gray-100 text-xs">${String.fromCharCode(65 + i)}</span>
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>`;
        }

        function checkAnswer(idx, btn) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);
            
            const q = quizData[state.idx];
            const isCorrect = idx === q.correct;
            if(isCorrect) state.score++;

            btn.classList.add(isCorrect ? 'correct' : 'incorrect');
            if(!isCorrect) buttons[q.correct].classList.add('correct', 'opacity-70');

            setTimeout(() => showModal(isCorrect, q.feedback), 600);
        }

        function showModal(correct, text) {
            const icon = document.getElementById('feedback-icon-container');
            const title = document.getElementById('feedback-title');
            icon.className = `w-16 h-16 mx-auto rounded-full flex items-center justify-center text-3xl mb-4 shadow-lg ${correct ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`;
            icon.innerHTML = correct ? '<i class="fas fa-check"></i>' : '<i class="fas fa-times"></i>';
            title.innerText = correct ? '¡Correcto!' : 'Incorrecto';
            title.className = `text-2xl font-bold mb-2 ${correct ? 'text-green-700' : 'text-red-700'}`;
            document.getElementById('feedback-text').innerText = text;
            
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                document.getElementById('feedback-card').classList.remove('scale-90', 'opacity-0');
                document.getElementById('feedback-card').classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function nextQuestion() {
            overlay.classList.add('opacity-0');
            document.getElementById('feedback-card').classList.add('scale-90', 'opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
                state.idx++;
                if(state.idx < quizData.length) renderQuiz();
                else renderEnd();
            }, 300);
        }

        function renderEnd() {
            const finalPct = Math.round((state.score / quizData.length) * 100);
            content.innerHTML = `
                <div class="flex flex-col h-full justify-center items-center text-center space-y-4 slide-up">
                    <div id="result-card" class="bg-white p-8 rounded-3xl shadow-lg border border-gray-100 w-full max-w-sm relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-1">${state.userName}</h2>
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-4">Resultado del Test</p>
                        <div class="bg-indigo-50 rounded-2xl p-6 mb-4">
                            <div class="text-5xl font-black text-indigo-600 mb-1">${finalPct}%</div>
                            <div class="text-sm font-bold text-indigo-300">Score: ${state.score}/${quizData.length}</div>
                        </div>
                        <p class="text-xs text-gray-500 leading-relaxed font-medium">"El liderazgo es la capacidad de convertir una visión en realidad a través de otros."</p>
                    </div>
                    
                    <button onclick="handleShareWhatsApp()" class="w-full max-w-xs bg-[#25D366] text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-3 active:scale-95 transition-transform">
                        <i class="fab fa-whatsapp text-xl"></i> Compartir por WhatsApp
                    </button>

                    <button onclick="location.reload()" class="text-xs text-gray-400 font-bold uppercase tracking-widest hover:text-indigo-500 transition-colors">
                        Reiniciar Test
                    </button>
                </div>`;
        }

        // --- LÓGICA DE COMPARTIR ADAPTADA ---
        const handleShareWhatsApp = async () => {
            loadingOverlay.classList.remove('hidden');
            const messageText = `🎮 TEST DE LIDERAZGO\n\n🎯 Misión: Influencia\n👤 Player: ${state.userName}\n💠 Score: ${state.score}/${quizData.length}`;

            await new Promise(resolve => setTimeout(resolve, 400));

            const resultCard = document.getElementById('result-card');

            if (resultCard && navigator.share) {
                try {
                    const canvas = await html2canvas(resultCard, {
                        scale: 2,
                        backgroundColor: "#ffffff",
                        useCORS: true
                    });
                    
                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            const file = new File([blob], "resultado_liderazgo.png", { type: "image/png" });
                            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                try {
                                    await navigator.share({
                                        files: [file],
                                        text: messageText,
                                    });
                                    loadingOverlay.classList.add('hidden');
                                } catch (err) {
                                    if(err.name !== 'AbortError') openWhatsAppTextFallback(messageText);
                                    else loadingOverlay.classList.add('hidden');
                                }
                            } else {
                                openWhatsAppTextFallback(messageText);
                            }
                        }
                    });
                } catch (error) {
                    openWhatsAppTextFallback(messageText);
                }
            } else {
                openWhatsAppTextFallback(messageText);
            }
        };

        const openWhatsAppTextFallback = (text) => {
            loadingOverlay.classList.add('hidden');
            const url = `https://wa.me/${FALLBACK_PHONE}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        };

        renderStart();
    </script>
</body>
</html>
