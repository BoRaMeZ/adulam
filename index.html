<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Evaluación: Rompiendo Topes</title>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html2Canvas -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Fonts: Nunito (Redondeada y Amigable) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif; /* Cambio a fuente amigable */
            background-color: #0f172a; /* Slate 900 */
            background-image: radial-gradient(circle at 50% 0%, #2e1065 0%, #0f172a 60%); /* Luz violeta suave arriba */
            color: #f8fafc;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animaciones suaves */
        .fade-enter { animation: fadeEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; } /* Rebote suave */
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeEnter {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .tap-effect:active {
            transform: scale(0.96);
            filter: brightness(0.9);
        }

        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden">

    <div id="root" class="w-full h-full max-w-md mx-auto relative flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // ⚙️ CONFIGURACIÓN
        // ==========================================
        const NUMERO_DEL_LIDER = ""; 
        // ==========================================

        // Iconos un poco más redondeados
        const Icons = {
            play: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" {...props}><path d="M8 5v14l11-7z"/></svg>,
            checkCircle: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" {...props}><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>,
            xCircle: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" {...props}><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>,
            share: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>,
            restart: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M1 4v6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M23 20v-6h-6"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>,
            chevronRight: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="9 18 15 12 9 6"/></svg>,
            user: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        };

        const questions = [
            {
                questionText: "¿Cuál es la premisa principal de la 'Ley del Tope'?",
                answerOptions: [
                    { answerText: "El ministerio crece sin importar lo que haga el líder.", isCorrect: false },
                    { answerText: "El crecimiento del ministerio se detiene donde el líder se detiene.", isCorrect: true },
                    { answerText: "El ministerio crece solo si hay recursos financieros.", isCorrect: false },
                    { answerText: "Los miembros siempre crecen más rápido que los líderes.", isCorrect: false },
                ],
                explanation: "Tú eres el techo de tu organización. Si tú dejas de crecer, bloqueas el crecimiento de todo el ministerio."
            },
            {
                questionText: "En la metáfora del edificio, si tú eres el ascensor y llegas al piso 8, ¿qué pasa con tu gente?",
                answerOptions: [
                    { answerText: "Suben por las escaleras al piso 20.", isCorrect: false },
                    { answerText: "Se quedan en la planta baja.", isCorrect: false },
                    { answerText: "Llegan solo hasta el piso 8 contigo.", isCorrect: true },
                    { answerText: "Buscan otro ascensor inmediatamente.", isCorrect: false },
                ],
                explanation: "Nadie puede ir más allá de donde su líder lo lleva. Tu nivel de madurez es el límite de ellos."
            },
            {
                questionText: "¿Qué consecuencia trae una gran unción sobre un carácter inmaduro?",
                answerOptions: [
                    { answerText: "Produce podredumbre y destrucción.", isCorrect: true },
                    { answerText: "Acelera la madurez del líder.", isCorrect: false },
                    { answerText: "Santifica automáticamente al líder.", isCorrect: false },
                    { answerText: "No tiene ninguna consecuencia negativa.", isCorrect: false },
                ],
                explanation: "El don sin carácter corrompe. Necesitas estructura interna para soportar el peso de la bendición."
            },
            {
                questionText: "¿Qué significa hacer la obra 'indolentemente' según Jeremías 48:10?",
                answerOptions: [
                    { answerText: "Hacerla muy rápido.", isCorrect: false },
                    { answerText: "Hacerla con negligencia, apatía o por cumplir.", isCorrect: true },
                    { answerText: "Hacerla sin dinero.", isCorrect: false },
                    { answerText: "Hacerla con mucho dolor.", isCorrect: false },
                ],
                explanation: "La indolencia es una actitud de tibieza y descuido que Dios condena severamente en el liderazgo."
            },
            {
                questionText: "Si los miembros son 'Computadoras Cuánticas', ¿tú qué eres en la analogía?",
                answerOptions: [
                    { answerText: "El antivirus.", isCorrect: false },
                    { answerText: "La electricidad.", isCorrect: false },
                    { answerText: "La Red de Internet (conexión).", isCorrect: true },
                    { answerText: "El teclado.", isCorrect: false },
                ],
                explanation: "Tú eres la conexión. Si tu red es lenta (tu liderazgo), limitas la velocidad de ellos, aunque sean potentes."
            },
            {
                questionText: "Según Proverbios 16:18, ¿dónde se origina realmente el tope?",
                answerOptions: [
                    { answerText: "En lo externo (circunstancias).", isCorrect: false },
                    { answerText: "En lo interno (soberbia, carácter).", isCorrect: true },
                    { answerText: "En la falta de apoyo.", isCorrect: false },
                    { answerText: "En el enemigo.", isCorrect: false },
                ],
                explanation: "Antes de la caída hay altivez. El problema raíz siempre está adentro: falta de gestión emocional o formación."
            },
            {
                questionText: "Según el consejo de Jetro a Moisés (Éxodo 18), ¿qué pasa si el líder no delega?",
                answerOptions: [
                    { answerText: "El líder se vuelve más fuerte.", isCorrect: false },
                    { answerText: "Desfallece el líder y también el pueblo.", isCorrect: true },
                    { answerText: "El pueblo aprende a esperar.", isCorrect: false },
                    { answerText: "Dios se agrada del esfuerzo.", isCorrect: false },
                ],
                explanation: "Un líder que lo hace todo se cansa y cansa a su gente. Delegar es vital para no ser el tope."
            },
            {
                questionText: "¿Por qué es necesaria la humildad (Prov 11:2) para quitar un tope?",
                answerOptions: [
                    { answerText: "Para caerle bien a la gente.", isCorrect: false },
                    { answerText: "Para reconocer que necesito corrección y organización.", isCorrect: true },
                    { answerText: "Para parecer más espiritual.", isCorrect: false },
                    { answerText: "La humildad no es necesaria.", isCorrect: false },
                ],
                explanation: "Sin humildad no puedes admitir que tienes un problema, y si no lo admites, no puedes cambiarlo."
            },
            {
                questionText: "¿Qué implica la 'Formación Intencional' (2 Timoteo 2:15)?",
                answerOptions: [
                    { answerText: "Esperar a que la iglesia me capacite.", isCorrect: false },
                    { answerText: "Aprender solo por experiencia.", isCorrect: false },
                    { answerText: "Procurar activamente estudiar y prepararse.", isCorrect: true },
                    { answerText: "Orar para recibir conocimiento sobrenatural.", isCorrect: false },
                ],
                explanation: "No es pasivo. Tú debes tener la intención de leer, estudiar y buscar crecimiento."
            },
            {
                questionText: "¿Cuál es el objetivo final de romper nuestros topes?",
                answerOptions: [
                    { answerText: "Ser famosos.", isCorrect: false },
                    { answerText: "Tener el ministerio más grande.", isCorrect: false },
                    { answerText: "Multiplicarnos y que otros crezcan.", isCorrect: true },
                    { answerText: "Trabajar menos.", isCorrect: false },
                ],
                explanation: "El éxito del líder es la multiplicación: que otros brillen y crezcan gracias a que tú les abriste camino."
            }
        ];

        function App() {
            const [gameState, setGameState] = useState('start');
            const [userName, setUserName] = useState('');
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showFeedback, setShowFeedback] = useState(false);
            const [isCorrect, setIsCorrect] = useState(false);
            const [selectedAnswerIndex, setSelectedAnswerIndex] = useState(null);
            const [isSent, setIsSent] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const resultCardRef = useRef(null);

            useEffect(() => {
                if (gameState === 'result' && score >= 7) {
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.6 },
                        colors: ['#a78bfa', '#2dd4bf', '#fb7185'], // Pastel violeta, teal, rosa
                        disableForReducedMotion: true
                    });
                }
            }, [gameState, score]);

            const handleStart = (e) => {
                e.preventDefault();
                if (userName.trim()) setGameState('quiz');
            };

            const handleAnswer = (isCorrect, index) => {
                if (showFeedback) return;
                setIsCorrect(isCorrect);
                setSelectedAnswerIndex(index);
                setShowFeedback(true);
                if (isCorrect) setScore(score + 1);
            };

            const handleNext = () => {
                const nextQuestion = currentQuestion + 1;
                if (nextQuestion < questions.length) {
                    setCurrentQuestion(nextQuestion);
                    setShowFeedback(false);
                    setSelectedAnswerIndex(null);
                } else {
                    setGameState('result');
                }
            };

            const handleRestart = () => {
                setScore(0);
                setCurrentQuestion(0);
                setGameState('start');
                setUserName('');
                setShowFeedback(false);
                setSelectedAnswerIndex(null);
                setIsSent(false);
            };

            const handleShareWhatsApp = async () => {
                setIsGenerating(true);
                const simpleHash = btoa(userName + score).slice(0, 5).toUpperCase();
                const messageText = `✨ MI RESULTADO ✨\n\n🚀 Tema: Topes\n👤 Soy: ${userName}\n🌟 Nota: ${score}/${questions.length}`;

                await new Promise(resolve => setTimeout(resolve, 300));

                if (resultCardRef.current && navigator.share) {
                    try {
                        const canvas = await html2canvas(resultCardRef.current, {
                            scale: 2,
                            backgroundColor: "#1e293b",
                            useCORS: true
                        });
                        
                        canvas.toBlob(async (blob) => {
                            if (blob) {
                                const file = new File([blob], "mi_progreso.png", { type: "image/png" });
                                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                    try {
                                        await navigator.share({
                                            files: [file],
                                            text: messageText,
                                        });
                                        setIsSent(true);
                                    } catch (err) {
                                        openWhatsAppTextFallback(messageText);
                                    }
                                } else {
                                    openWhatsAppTextFallback(messageText);
                                }
                            }
                        });
                    } catch (error) {
                        openWhatsAppTextFallback(messageText);
                    }
                } else {
                    openWhatsAppTextFallback(messageText);
                }
                setIsGenerating(false);
            };

            const openWhatsAppTextFallback = (text) => {
                const url = `https://wa.me/${NUMERO_DEL_LIDER}?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
                setIsSent(true);
            };

            // --- VISTA: INICIO ---
            if (gameState === 'start') {
                return (
                    <div className="flex-1 flex flex-col justify-center items-center p-8 fade-enter relative overflow-hidden">
                        
                        <div className="z-10 w-full max-w-sm text-center">
                            {/* Icono más amigable */}
                            <div className="inline-flex items-center justify-center w-24 h-24 rounded-[2rem] bg-indigo-600/20 text-indigo-400 mb-8 border border-indigo-500/30 shadow-[0_0_30px_rgba(99,102,241,0.2)] transform rotate-3 transition hover:rotate-6">
                                <Icons.user className="w-12 h-12" />
                            </div>
                            
                            <h1 className="text-4xl font-black text-white tracking-tight mb-2 leading-tight">
                                Rompiendo <br/>
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Topes</span> 🚀
                            </h1>
                            <p className="text-slate-400 font-semibold mb-10 text-lg">Test Danza y Corros</p>

                            <form onSubmit={handleStart} className="space-y-4">
                                <div>
                                    <input 
                                        type="text" 
                                        value={userName}
                                        onChange={(e) => setUserName(e.target.value)}
                                        placeholder="👋 ¿Cómo te llamas?"
                                        className="w-full bg-slate-800/80 text-white border-2 border-transparent focus:border-indigo-500 rounded-2xl px-6 py-5 text-center text-lg font-bold outline-none transition-all placeholder-slate-500 shadow-lg"
                                        required
                                    />
                                </div>
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-600/30 transition-all active:scale-95 flex items-center justify-center gap-3 text-lg tap-effect">
                                    ¡Empezar! <Icons.play className="w-6 h-6" />
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // --- VISTA: RESULTADO ---
            if (gameState === 'result') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 fade-enter overflow-y-auto">
                        
                        <h2 className="text-indigo-200 font-bold text-lg mb-6 flex items-center gap-2 bg-indigo-900/30 px-4 py-1 rounded-full border border-indigo-500/20">
                            ✨ ¡Terminaste!
                        </h2>

                        {/* TARJETA DE RESULTADO */}
                        <div ref={resultCardRef} className="w-full max-w-sm bg-slate-800/90 backdrop-blur rounded-[2rem] p-8 border border-slate-700 shadow-2xl relative overflow-hidden">
                            {/* Decoración */}
                            <div className="absolute -top-10 -right-10 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl"></div>
                            <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl"></div>
                            
                            <div className="text-center mb-6 relative z-10">
                                <div className="text-slate-400 font-bold uppercase text-xs tracking-wider mb-1">Líder</div>
                                <h3 className="text-3xl font-black text-white">{userName}</h3>
                            </div>

                            <div className="flex items-center justify-center py-4 relative z-10">
                                <div className="relative w-44 h-44 flex items-center justify-center bg-slate-900/50 rounded-full border-4 border-slate-800 shadow-inner">
                                    <svg className="w-full h-full transform -rotate-90 p-2">
                                        <circle cx="50%" cy="50%" r="70" stroke="#334155" strokeWidth="14" fill="none" strokeLinecap="round" />
                                        <circle cx="50%" cy="50%" r="70" stroke="#818cf8" strokeWidth="14" fill="none" 
                                            strokeDasharray={440}
                                            strokeDashoffset={440 - (440 * score / questions.length)}
                                            strokeLinecap="round"
                                            className="drop-shadow-[0_0_10px_rgba(129,140,248,0.5)]"
                                        />
                                    </svg>
                                    <div className="absolute text-center">
                                        <span className="block text-5xl font-black text-white">{score}</span>
                                        <span className="block text-xs text-indigo-300 font-bold uppercase mt-1">de {questions.length}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="text-center mt-4 relative z-10">
                                <p className={`text-xl font-black ${score >= 7 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                    {score === questions.length ? "🦄 ¡Nivel Experto!" : score >= 7 ? "🎉 ¡Muy Bien!" : "📚 ¡A Repasar!"}
                                </p>
                            </div>
                        </div>

                        {/* BOTONES FIJOS INFERIORES */}
                        <div className="w-full max-w-sm mt-8 space-y-3 safe-bottom">
                            <button 
                                onClick={handleShareWhatsApp}
                                disabled={isGenerating}
                                className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-900/50 flex items-center justify-center gap-2 active:scale-95 transition-all tap-effect"
                            >
                                {isGenerating ? "Creando imagen..." : <><Icons.share className="w-5 h-5" /> Compartir Logro</>}
                            </button>
                            
                            <button onClick={handleRestart} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-colors border border-slate-700">
                                <Icons.restart className="w-5 h-5" /> Volver a intentar
                            </button>
                        </div>
                    </div>
                );
            }

            // --- VISTA: PREGUNTAS (LAYOUT AMIGABLE) ---
            return (
                <div className="flex-1 flex flex-col h-full relative">
                    {/* Header */}
                    <div className="px-6 py-5 flex justify-between items-center z-10">
                        <div className="w-full bg-slate-800 h-3 rounded-full overflow-hidden border border-slate-700">
                            <div 
                                className="bg-gradient-to-r from-indigo-500 to-purple-500 h-full transition-all duration-500 ease-out rounded-full"
                                style={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }}
                            ></div>
                        </div>
                        <div className="ml-4 font-bold text-indigo-400 whitespace-nowrap bg-indigo-900/30 px-3 py-1 rounded-lg text-sm border border-indigo-500/20">
                            {currentQuestion + 1}/{questions.length}
                        </div>
                    </div>

                    {/* Contenido con Scroll */}
                    <div className="flex-1 overflow-y-auto no-scrollbar px-6 pb-24">
                        <h2 className="text-2xl font-black text-white mb-8 leading-tight drop-shadow-sm">
                            {questions[currentQuestion].questionText}
                        </h2>

                        <div className="space-y-4"> 
                            {questions[currentQuestion].answerOptions.map((option, index) => {
                                let btnClass = "w-full text-left p-5 rounded-2xl border-2 border-slate-700 bg-slate-800/50 transition-all active:scale-[0.97] tap-effect font-semibold text-slate-200 shadow-sm";
                                
                                if (showFeedback) {
                                    if (index === selectedAnswerIndex) {
                                        if (option.isCorrect) {
                                            btnClass = "w-full text-left p-5 rounded-2xl border-2 border-emerald-500 bg-emerald-500/20 text-emerald-300 font-bold shadow-[0_0_15px_rgba(16,185,129,0.2)]";
                                        } else {
                                            btnClass = "w-full text-left p-5 rounded-2xl border-2 border-rose-500 bg-rose-500/20 text-rose-300 font-bold";
                                        }
                                    } else if (option.isCorrect) {
                                        btnClass = "w-full text-left p-5 rounded-2xl border-2 border-emerald-500/50 bg-emerald-500/10 text-emerald-200/70 opacity-80";
                                    } else {
                                        btnClass = "w-full text-left p-5 rounded-2xl border-2 border-slate-800 bg-slate-900 text-slate-600 opacity-50";
                                    }
                                }

                                return (
                                    <button 
                                        key={index} 
                                        onClick={() => handleAnswer(option.isCorrect, index)}
                                        disabled={showFeedback}
                                        className={btnClass}
                                    >
                                        {option.answerText}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Feedback (Bottom Sheet Amigable) */}
                    {showFeedback && (
                        <div className="fixed bottom-0 left-0 w-full bg-[#1e293b] rounded-t-[2.5rem] shadow-[0_-10px_50px_rgba(0,0,0,0.6)] border-t border-slate-700 slide-up z-20 safe-bottom">
                            {/* Manija decorativa */}
                            <div className="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mt-4 mb-2 opacity-50"></div>
                            
                            <div className="p-8 pt-4">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className={`p-2 rounded-full ${isCorrect ? 'bg-emerald-500/20' : 'bg-rose-500/20'}`}>
                                        {isCorrect ? (
                                            <Icons.checkCircle className="w-8 h-8 text-emerald-400" />
                                        ) : (
                                            <Icons.xCircle className="w-8 h-8 text-rose-400" />
                                        )}
                                    </div>
                                    <span className={`text-2xl font-black ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                                        {isCorrect ? '¡Eso es! 🎉' : 'Oh no... 😅'}
                                    </span>
                                </div>
                                
                                <div className="bg-slate-900/50 p-4 rounded-2xl border border-slate-700/50 mb-6">
                                    <p className="text-indigo-200 font-bold text-xs uppercase mb-1 tracking-wider">La explicación:</p>
                                    <p className="text-slate-300 text-base leading-relaxed font-medium">
                                        {questions[currentQuestion].explanation}
                                    </p>
                                </div>

                                <button 
                                    onClick={handleNext} 
                                    className="w-full bg-white hover:bg-slate-100 text-slate-900 font-black py-5 rounded-2xl active:scale-95 transition-transform flex justify-center items-center gap-2 text-lg shadow-xl"
                                >
                                    {currentQuestion === questions.length - 1 ? "Ver Resultados" : "Siguiente Pregunta"} <Icons.chevronRight className="w-6 h-6"/>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
